<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EFE4">
<title>迷因捕手</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="/api/custom.css">
<script>
  // the last known theme and frame, so the first paint already matches the settings
  try {
    const t = localStorage.getItem("memeseeks-theme"), f = localStorage.getItem("memeseeks-frame");
    if (t === "night") document.documentElement.dataset.theme = "night";
    if (f === "off") document.documentElement.dataset.frame = "off";
  } catch (e) { /* storage blocked: the settings apply a moment later */ }
</script>
</head>
<body>
<div class="wrap">
  <header class="bar" id="bar">
    <a class="brand" href="./" data-nav aria-label="迷因捕手，回首页">
      <svg class="cat" aria-hidden="true"></svg>
      <span class="wordmark"><span class="zh">迷因捕手</span><span class="en"><i>M</i><i>E</i><i>M</i><i>E</i><i>S</i><i>E</i><i>E</i><i>K</i><i>S</i></span></span>
    </a>
    <form class="search" role="search" data-search>
      <label class="visually-hidden" for="bar-q">描述你记得的那张梗图</label>
      <input id="bar-q" name="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="描述你记得的那张梗图">
      <button type="submit">搜</button>
    </form>
    <nav class="nav" aria-label="主导航">
      <a href="?view=albums" data-nav data-tab="albums">图集</a>
      <a href="?view=feed" data-nav data-tab="feed">刷梗</a>
      <a href="?view=review" data-nav data-tab="review" id="nav-review" hidden>待确认 <b id="nav-review-count"></b></a>
      <a href="?view=settings" data-nav data-tab="settings">设置</a>
    </nav>
  </header>
  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabbar" aria-label="主导航">
  <a href="./" data-nav data-tab="home">首页</a>
  <a href="?view=albums" data-nav data-tab="albums">图集</a>
  <a href="?view=feed" data-nav data-tab="feed">刷梗</a>
  <a href="?view=settings" data-nav data-tab="settings">设置</a>
</nav>

<dialog class="panel" id="picker" aria-labelledby="picker-title">
  <div class="panel-head"><h2 id="picker-title">加入图集</h2><button type="button" class="x" data-close aria-label="关闭">×</button></div>
  <ul class="picker-list" id="picker-list"></ul>
  <form class="picker-new" id="picker-new">
    <input name="name" maxlength="40" autocomplete="off" placeholder="新图集的名字" aria-label="新图集的名字">
    <button type="submit" class="btn">新建</button>
  </form>
</dialog>

<dialog class="viewer" id="viewer" aria-label="网上找到的梗图">
  <button type="button" class="x" data-close aria-label="关闭">×</button>
  <figure><img id="viewer-img" alt=""><figcaption id="viewer-text"></figcaption></figure>
  <div class="actions" id="viewer-actions"></div>
</dialog>

<div class="toast" id="toast" role="status" hidden><b></b><span></span></div>

<script src="popcat.js"></script>
<script src="cat.js"></script>
<script src="frame.js"></script>
<script src="app.js"></script>
</body>
</html>
