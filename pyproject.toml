[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memeseeks"
version = "0.4.0"
description = "迷因捕手 — a free, open-source app for collecting memes and finding them by what they say."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pillow>=10.1", "pillow-heif>=0.16", "numpy>=1.26", "pyyaml>=6", "opencc-python-reimplemented>=0.1.7"]

[project.optional-dependencies]
ml = [  # search on ONNX Runtime: 8-bit copies of the models, no PyTorch (models/store.py)
  "onnxruntime>=1.23",
  "tokenizers>=0.15",
  "huggingface_hub>=0.23",
  "rapidocr_onnxruntime==1.4.4",
]
torch = [  # the original models on PyTorch (MEMESEEKS_BACKEND=torch), and tidying text on a GPU (tidy.py, vlm.py)
  "transformers>=4.51,<5",
  "accelerate>=0.33",
  "sentence-transformers>=3.0",
]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "segno>=1.5"]
app = ["pywebview>=6.2; sys_platform == 'win32'"]  # its own window (appwindow.py), in the Windows installer
dev = ["pytest>=8", "httpx2", "fastapi>=0.110", "uvicorn>=0.29", "segno>=1.5", "onnxruntime>=1.23", "tokenizers>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memeseeks = ["web/*", "web/fonts/*", "web/icons/*", "browser/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["ml: needs model weights; run on the GPU box with MEMESEEKS_ML_TESTS=1"]

[project.scripts]
memeseeks = "memeseeks.cli:main"
