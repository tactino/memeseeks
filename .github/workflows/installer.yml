name: installer

# The Windows installer from the current commit, to try before a release: gh workflow run installer
# (A release builds it too, and puts it on the release: release.yml.)
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      wheel-artifact:
        type: string
        default: ""

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.wheel-artifact != ''
        with:
          name: ${{ inputs.wheel-artifact }}
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: build the installer
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wheel) { ./installer/windows/build.ps1 -Wheel $wheel.FullName } else { ./installer/windows/build.ps1 }
      - name: install it silently, check it runs, uninstall it
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "memeseeks app"
          $lib = Join-Path $env:RUNNER_TEMP "memeseeks library"
          $setup = Start-Process installer/windows/build/memeseeks-windows-setup.exe -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=""""", "/DIR=""$dir""", "/LIBRARY=""$lib"""
          if ($setup.ExitCode -ne 0) { throw "setup exited with $($setup.ExitCode)" }
          $config = Get-Content (Join-Path $dir "launcher.json") -Raw -Encoding utf8 | ConvertFrom-Json
          if ($config.library -ne $lib) { throw "launcher.json has library $($config.library)" }
          & (Join-Path $dir "python\python.exe") -c "import memeseeks, memeseeks.tray, onnxruntime, tokenizers, webview; print('memeseeks', memeseeks.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "the installed app does not import" }
          # the search models: downloaded (about 1 GB) and run by the installed Python
          $env:HF_HOME = Join-Path $env:RUNNER_TEMP "models"
          & (Join-Path $dir "python\python.exe") -c @'
          from PIL import Image
          from memeseeks.models.store import make
          bge, clip = make("bge"), make("clip")
          t = bge.embed(["一只猫", "a cat", "一辆汽车"])
          assert t[0] @ t[1] > t[0] @ t[2], "BGE-M3 is not cross-lingual"
          img = clip.embed_images([Image.new("RGB", (400, 300), (220, 20, 20))])[0]
          q = clip.embed_texts(["一张红色的图片", "一张蓝色的图片"])
          assert q[0] @ img > q[1] @ img, "Chinese-CLIP does not tell red from blue"
          print("models ok:", bge.model_id, clip.model_id)
          '@
          if ($LASTEXITCODE -ne 0) { throw "the search models do not run" }
          $un = Start-Process (Join-Path $dir "unins000.exe") -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir "python")) { throw "uninstalling left the program behind" }
      - name: an update over 0.3.3 (which had PyTorch) leaves none of it behind
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "memeseeks update"
          $lib = Join-Path $env:RUNNER_TEMP "memeseeks update library"
          $old = Join-Path $env:RUNNER_TEMP "memeseeks-0.3.3-setup.exe"
          Invoke-WebRequest https://github.com/tactino/memeseeks/releases/download/v0.3.3/memeseeks-windows-setup.exe -OutFile $old
          foreach ($setup in @($old, "installer/windows/build/memeseeks-windows-setup.exe")) {
            $p = Start-Process $setup -Wait -PassThru `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=""""", "/DIR=""$dir""", "/LIBRARY=""$lib"""
            if ($p.ExitCode -ne 0) { throw "$setup exited with $($p.ExitCode)" }
          }
          if (Test-Path (Join-Path $dir "python\Lib\site-packages\torch")) { throw "the update kept PyTorch" }
          & (Join-Path $dir "python\python.exe") -c "import memeseeks, memeseeks.tray, onnxruntime; print('updated to', memeseeks.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "the updated app does not import" }
          $size = (Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("updated app: {0:N0} MB" -f $size)
          Start-Process (Join-Path $dir "unins000.exe") -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/windows/build/memeseeks-windows-setup.exe
          retention-days: 14
